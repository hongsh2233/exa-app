# Render 배포 설정 (Blueprint)
# Render 대시보드에서 New → Blueprint → 이 저장소를 고르면 아래 설정대로 변환 서버가 만들어집니다.
services:
  - type: web
    name: exa-convert
    runtime: docker
    plan: free
    region: singapore # 한국에서 가장 가까운 지역
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - server/** # server 폴더가 바뀔 때만 다시 배포합니다.
    envVars:
      - key: ALLOWED_ORIGINS # 이 주소의 웹페이지만 변환 서버를 쓸 수 있습니다. (쉼표로 여러 개)
        value: https://exa-app-xi.vercel.app
      - key: MAX_FILE_MB
        value: "20"
      - key: TIMEOUT_SECONDS
        value: "120"
